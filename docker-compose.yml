version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumora-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Add your environment variables here or use env_file
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - NANOBANANA_API_KEY=${NANOBANANA_API_KEY}
      # - ALLOWED_ORIGINS=*
    env_file:
      - .env  # Load from .env file if it exists
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Optional: Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
